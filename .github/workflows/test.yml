name: Build and Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run build
      - run: npm run format-check
      - run: npm run lint
      - run: npm test -- --runInBand
      - name: Verify generated distribution and docs
        run: __test__/verify-no-unstaged-changes.sh

  checkout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Provision the runner executable, as self-hosted runners do once.
      # This commit includes pool-backed fetch support; npm 2.1.0 predates it.
      - uses: actions/checkout@v7
        with:
          repository: bhouston/git-dedup
          ref: 05b6152df26c03fd97bd95e3d100db0123d350af
          path: .test-tools/git-dedup
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.3
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: pnpm --dir .test-tools/git-dedup install --frozen-lockfile
      - run: pnpm --dir .test-tools/git-dedup build
      - run: npm link --ignore-scripts
        working-directory: .test-tools/git-dedup/packages/cli
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
      - name: First checkout using the default store
        uses: ./
        with:
          path: dedup-first
          fetch-depth: 1
      - name: Second checkout reusing the default store
        uses: ./
        with:
          path: dedup-second
          fetch-depth: 10
          filter: tree:0
          sparse-checkout: |
            src
            .github
      - name: Fetch again into an existing checkout
        uses: ./
        with:
          path: dedup-first
          fetch-depth: 50
          filter: blob:none
          persist-credentials: false
      - name: Verify full history, shared objects and sparse files
        run: node __test__/verify-git-dedup.mjs dedup-first dedup-second
