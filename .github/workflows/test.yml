name: Build and Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run build
      - run: npm run format-check
      - run: npm run lint
      - run: npm test -- --runInBand
      - name: Verify generated distribution and docs
        run: __test__/verify-no-unstaged-changes.sh

  checkout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm install --global git-dedup@3.0.2
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
      # Hosted runners have no SSH key; full-history checkouts clone this public repo over HTTPS instead.
      - run: git config --global url.https://github.com/.insteadOf git@github.com:
      - name: First checkout using the default store
        uses: ./
        with:
          path: dedup-first
          fetch-depth: 0
      - name: Second checkout reusing the default store
        uses: ./
        with:
          path: dedup-second
          fetch-depth: 00
          sparse-checkout: |
            src
            .github
      - name: Fetch again into an existing checkout
        uses: ./
        with:
          path: dedup-first
          fetch-depth: 0
          persist-credentials: false
      - name: Verify full history, shared objects and sparse files
        run: node __test__/verify-git-dedup.mjs dedup-first dedup-second
